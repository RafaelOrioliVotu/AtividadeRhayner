<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APURAÇÃO</title>
    <style>
        * {
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            text-align: center;
        }

        body {
            background-color: rgb(232, 252, 252);
        }

        fieldset {
            background-color: lightgray;
            border: 2px solid black;
        }

        ul {
            list-style-position: inside;
            padding-left: 0px;
        }

        li {
            padding-top: 15px;
        }
    </style>
</head>

<body>
    <header>
        <h1>APURAÇÃO DOS VOTOS</h1>
        <h3>REPRESENTANTE DE SALA</h3>
    </header>
    <section>
        <fieldset>
            <h4>CONTAGEM DE VOTOS ATÉ O MOMENTO</h4>
            <form>
                <ul type="circle">
                    <li>CANDIDATO 1</li>
                    <li>CANDIDATO 2</li>
                    <li>CANDIDATO 3</li>
                    <li>CANDIDATO 4</li>
                    <li>CANDIDATO 5</li>
            </form>
        </fieldset>
    </section>
</body>

</html>
